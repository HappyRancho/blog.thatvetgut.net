name: Check article sources and photography
on:
  pull_request:
    paths:
      - scripts/content-research.mjs
      - .github/workflows/content-research.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/content-research.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-research
          path: content-research/
