name: Validate rebuild
on:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:worker
      - name: Validate Cloudflare static deployment
        run: npx --yes wrangler@4.147.0 deploy --dry-run --outdir /tmp/thatvetguy-worker-dry-run
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        id: browser
        timeout-minutes: 3
      - run: npm run test:cms
        if: ${{ success() || (failure() && steps.browser.outcome == 'failure') }}
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-validation
          path: |
            dist/
            firestore-debug.log
            package-lock.json
            src/
            docs/
            tests/
            screenshots/
            worker/
            scripts/
            firestore.rules
            wrangler.jsonc
            package.json
            tsconfig.json
            vite.config.ts
            firebase.json
            firestore.indexes.json
            README.md
