name: Validate rebuild
on:
  pull_request:
  push:
    branches: [rebuild/firebase-spark]
permissions:
  contents: read
jobs:
  build-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-fund --no-audit
      - run: npm test
      - run: npm run build
      - run: npm run test:rules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-validation
          path: |
            dist/
            firestore-debug.log
            package-lock.json
