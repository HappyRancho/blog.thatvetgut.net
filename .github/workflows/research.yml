name: Publication benchmark
on:
  pull_request:
    paths:
      - scripts/research.mjs
      - .github/workflows/research.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: node scripts/research.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-benchmark
          path: research/
      - name: Package local verification dependencies
        run: |
          tar -czf /tmp/verification-deps.tgz node_modules
          mkdir -p /tmp/dependency-parts
          split -b 24000000 /tmp/verification-deps.tgz /tmp/dependency-parts/part-
      - uses: actions/upload-artifact@v4
        with:
          name: verification-deps-a
          path: /tmp/dependency-parts/part-aa
      - uses: actions/upload-artifact@v4
        with:
          name: verification-deps-b
          path: /tmp/dependency-parts/part-ab
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: verification-deps-c
          path: /tmp/dependency-parts/part-ac
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: verification-deps-d
          path: /tmp/dependency-parts/part-ad
          if-no-files-found: ignore
